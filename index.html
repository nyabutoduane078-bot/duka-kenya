<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>DUKA KENYA | Online Shopping</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <div class="logo">DUKA<span>KENYA</span></div>

    <div class="search-box">
        <input type="search" id="searchInput"
        placeholder="Search products, brands and categories...">
        <button onclick="searchProducts()">Search</button>
    </div>

    <div class="header-actions">
        <button onclick="showLogin()">Account</button>
        <button onclick="showCart()">🛒 Cart <span id="cartCount">0</span></button>
    </div>
</header>

<nav class="navbar">
    <a href="#">Home</a>
    <a href="#categories">Categories</a>
    <a href="#products">Products</a>
    <a href="#deals">Today's Deals</a>
</nav>

<section class="hero">
    <div class="hero-content">
        <p>WELCOME TO DUKA KENYA</p>
        <h1>Everything You Need.<br>Delivered To Your Door.</h1>
        <p>Discover amazing products at affordable prices.</p>
        <a href="#products" class="shop-button">SHOP NOW</a>
    </div>
</section>

<section class="benefits">
    <div>🚚 <strong>Fast Delivery</strong></div>
    <div>🔒 <strong>Secure Shopping</strong></div>
    <div>💳 <strong>Easy Payments</strong></div>
    <div>⭐ <strong>Quality Products</strong></div>
</section>

<section id="categories" class="section">
    <h2>Shop By Category</h2>

    <div class="categories">
        <button class="category" onclick="filterCategory('all')">
            🛍️
            <p>All Products</p>
        </button>

        <button class="category" onclick="filterCategory('electronics')">
            📱
            <p>Electronics</p>
        </button>

        <button class="category" onclick="filterCategory('fashion')">
            👕
            <p>Fashion</p>
        </button>

        <button class="category" onclick="filterCategory('home')">
            🏠
            <p>Home & Living</p>
        </button>

        <button class="category" onclick="filterCategory('beauty')">
            💄
            <p>Beauty</p>
        </button>

        <button class="category" onclick="filterCategory('accessories')">
            ⌚
            <p>Accessories</p>
        </button>
    </div>
</section>
